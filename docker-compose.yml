# Sobe tudo junto: Ollama (embeddings bge-m3) -> API Python (rag/) -> Frontend Next.js
#   docker compose up --build
#   abra http://localhost:3000
#
# Na primeira vez o serviço ollama-pull baixa o bge-m3 (~1,2 GB) e a API indexa a base
# ao iniciar (alguns minutos em CPU; o frontend só sobe depois). Os dois ficam salvos em
# volumes, então as próximas subidas são rápidas.

services:
  ollama:
    image: ollama/ollama:0.32.0
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Executa uma vez: baixa o modelo de embeddings e termina
  ollama-pull:
    image: ollama/ollama:0.32.0
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "bge-m3"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./rag
    environment:
      OLLAMA_URL: http://ollama:11434
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - chroma:/app/chroma_db
    ports:
      - "8000:8000"
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama:
  chroma: